<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeTriage Report - Bee Tree Structure</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-graphviz@5.0.2/build/d3-graphviz.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #fafafa; 
        }
        #graph { 
            width: 100%; 
            height: 100vh; 
            background: white; 
        }
    </style>
</head>
<body>
<div id="graph"></div>
<script>
    const treeDot = `digraph BeeTree {
  rankdir=TB;
  splines=ortho;
  nodesep=1;
  ranksep=2;
  node [shape=box, style="rounded,filled", fontname="Arial", fontsize=10, labeljust=l];
  edge [color="#666", penwidth=1];

  "root" [label="root", fillcolor="#2196F3"];
  "root" -> "cli";
  "cli" [label="cli", fillcolor="#2196F3"];
  "cli" -> "ArgsParser_java";
  "ArgsParser_java" [label="ArgsParser.java\n\nClasses:\n  public ArgsParser\n    Methods / Functions:\n      public Config parse | (String[] args) -> Config", fillcolor="#4CAF50"];
  "cli" -> "Config_java";
  "Config_java" [label="Config.java\n\nClasses:\n  public Config", fillcolor="#4CAF50"];
  "root" -> "CodeOverSight";
  "CodeOverSight" [label="CodeOverSight", fillcolor="#2196F3"];
  "CodeOverSight" -> "CodeOverSight_java";
  "CodeOverSight_java" [label="CodeOverSight.java\n\nClasses:\n  public CodeOverSight\n    Methods / Functions:\n      public void main | (String[] args) -> void", fillcolor="#4CAF50"];
  "root" -> "CodeTriage_java";
  "CodeTriage_java" [label="CodeTriage.java\n\nClasses:\n  public CodeTriage\n    Methods / Functions:\n      public void main | (String[] args) -> void", fillcolor="#4CAF50"];
  "root" -> "graph";
  "graph" [label="graph", fillcolor="#2196F3"];
  "graph" -> "DotGenerator_java";
  "DotGenerator_java" [label="DotGenerator.java\n\nClasses:\n  public DotGenerator\n    Methods / Functions:\n      public String generate | (List<FileInfo> files, Config config) -> String\n      private String getNodeId | (FileInfo file) -> String\n      private String buildNodeLabel | (FileInfo file) -> String\n      private String resolveImport | (String importName, Set<String> internalClasses, List<FileInfo> files) -> String", fillcolor="#4CAF50"];
  "root" -> "model";
  "model" [label="model", fillcolor="#2196F3"];
  "model" -> "ClassInfo_java";
  "ClassInfo_java" [label="ClassInfo.java\n\nClasses:\n  public ClassInfo\n   Constructor parameters: String className, String modifier, List<MethodSig> methods, List<String> exceptions, List<String> interfaces, List<String> extensions\n    Methods / Functions:", fillcolor="#4CAF50"];
  "model" -> "FileInfo_java";
  "FileInfo_java" [label="FileInfo.java\n\nClasses:\n  public FileInfo\n   Constructor parameters: String path, String className, String packageName, List<MethodSig> methods, List<String> imports, List<ClassInfo> classes\n    Methods / Functions:", fillcolor="#4CAF50"];
  "model" -> "MethodSig_java";
  "MethodSig_java" [label="MethodSig.java\n\nClasses:\n  public MethodSig\n   Constructor parameters: String name, String params, String returnType, String modifier, List<String> exceptions\n    Methods / Functions:\n      public String signature | () -> String", fillcolor="#4CAF50"];
  "model" -> "TreeNode_java";
  "TreeNode_java" [label="TreeNode.java\n\nClasses:\n  public TreeNode\n   Constructor parameters: String name, String type\n    Methods / Functions:\n      public void addChild | (TreeNode child) -> void\n      public void setFullPath | (String path) -> void\n      public void setSignature | (String sig) -> void\n      public void setDescription | (String desc) -> void", fillcolor="#4CAF50"];
  "root" -> "parser";
  "parser" [label="parser", fillcolor="#2196F3"];
  "parser" -> "FileParser_java";
  "FileParser_java" [label="FileParser.java\n\nClasses:\n  public FileParser\n    Methods / Functions:\n      public Optional<FileInfo> parse | (File file, Config config) -> Optional<FileInfo>\n      private Optional<FileInfo> parseInternal | (File file) -> Optional<FileInfo>\n      private MethodSig toMethodSig | (MethodDeclaration method) -> MethodSig\n      private MethodSig toConstructorSig | (ConstructorDeclaration constructor, String className) -> MethodSig\n      private String getModifier | (com.github.javaparser.ast.NodeList<com.github.javaparser.ast.Modifier> modifiers) -> String", fillcolor="#4CAF50"];
  "root" -> "render";
  "render" [label="render", fillcolor="#2196F3"];
  "render" -> "BeeTreeJsonExporter_java";
  "BeeTreeJsonExporter_java" [label="BeeTreeJsonExporter.java\n\nClasses:\n  public BeeTreeJsonExporter\n    Methods / Functions:\n      public String exportBeeTree | (TreeNode root) -> String\n      private String nodeToJson | (TreeNode node, int indent) -> String\n      private String getIndent | (int spaces) -> String\n      private String escapeJson | (String str) -> String\n      private String escapeJsonString | (String str) -> String", fillcolor="#4CAF50"];
  "render" -> "BeeTreeRenderer_java";
  "BeeTreeRenderer_java" [label="BeeTreeRenderer.java\n\nClasses:\n  public BeeTreeRenderer\n    Methods / Functions:\n      public String render | (TreeNode root) -> String\n      private String renderDot | (TreeNode root) -> String\n      private String escapeBackticks | (String text) -> String\n      private void renderNode | (TreeNode node, StringBuilder dot) -> void\n      private String sanitizeId | (String name) -> String\n      private boolean isValidType | (String type) -> boolean\n      private String getColor | (String type) -> String\n      private String escapeLabel | (String text) -> String", fillcolor="#4CAF50"];
  "render" -> "HtmlRenderer_java";
  "HtmlRenderer_java" [label="HtmlRenderer.java\n\nClasses:\n  public HtmlRenderer\n    Methods / Functions:\n      public void render | (String dot, List<FileInfo> fileInfos, List<File> sourceFiles, String rootPath, String outputPath) -> void\n      private String readTemplate | (String templateName) -> String\n      private String insertBeforeExtension | (String path, String insert) -> String", fillcolor="#4CAF50"];
  "render" -> "TreeRenderer_java";
  "TreeRenderer_java" [label="TreeRenderer.java\n\nClasses:\n  public TreeRenderer\n    Methods / Functions:\n      public String render | (TreeNode root) -> String\n      private void renderNode | (TreeNode node, StringBuilder dot) -> void\n      private String sanitizeId | (String name) -> String\n      private boolean isValidType | (String type) -> boolean\n      private String getIcon | (String type) -> String\n      private String getNodeClass | (String type) -> String\n      private String getIndent | (int depth) -> String\n      private String escapeHtml | (String text) -> String\n      private String getTreeCSS | () -> String\n      private String getTreeJS | () -> String\n      private String getColor | (String type) -> String", fillcolor="#4CAF50"];
  "root" -> "util";
  "util" [label="util", fillcolor="#2196F3"];
  "util" -> "BeeTreeBuilder_java";
  "BeeTreeBuilder_java" [label="BeeTreeBuilder.java\n\nClasses:\n  public BeeTreeBuilder\n    Methods / Functions:\n      public TreeNode buildTree | (List<File> sourceFiles, List<FileInfo> parsedFiles, String rootPath) -> TreeNode\n      private String generateFileDescription | (FileInfo fileInfo) -> String", fillcolor="#4CAF50"];
  "util" -> "FileLister_java";
  "FileLister_java" [label="FileLister.java\n\nClasses:\n  public FileLister\n    Methods / Functions:\n      public List<File> listFiles | (Config config) -> List<File>", fillcolor="#4CAF50"];
  "util" -> "TreeBuilder_java";
  "TreeBuilder_java" [label="TreeBuilder.java\n\nClasses:\n  public TreeBuilder\n    Methods / Functions:\n      public TreeNode buildTree | (List<File> sourceFiles, List<FileInfo> parsedFiles, String rootPath) -> TreeNode", fillcolor="#4CAF50"];
}
`;
    d3.select("#graph").graphviz()
        .fit(true)
        .zoom(true)
        .renderDot(treeDot);
</script>
</body>
</html>
